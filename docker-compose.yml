services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: eduapp
      POSTGRES_PASSWORD: eduapp
      POSTGRES_DB: eduapp
    ports:
      # 5432 y 5433 del host ya están ocupados por otros Postgres del sistema
      # (ajenos a este proyecto: un postgresql@14 de Homebrew corriendo como
      # servicio nativo quedó escuchando en 5433, no en 5432 como se pensaba
      # al principio, y pisaba este mapeo en silencio) — se usa 5435 en su
      # lugar. Dentro de la red de Docker sigue siendo el 5432 de siempre.
      - "5435:5432"
    volumes:
      - eduapp_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - eduapp_redis_data:/data

volumes:
  eduapp_postgres_data:
  eduapp_redis_data:
