services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: eduapp
      POSTGRES_PASSWORD: eduapp
      POSTGRES_DB: eduapp
    ports:
      # 5432 del host ya está ocupado por otro Postgres del sistema (ajeno a
      # este proyecto) — se mapea al 5433 en el host en su lugar. Dentro de
      # la red de Docker sigue siendo el 5432 de siempre.
      - "5433:5432"
    volumes:
      - eduapp_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - eduapp_redis_data:/data

volumes:
  eduapp_postgres_data:
  eduapp_redis_data:
